<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Calendar</title>
<link rel="stylesheet" href="static/style.css?v=23">
<style>
  /* Compact embed: sits inside a dashboard card, so no page chrome of its own.
     The embed keeps the FULL toolset; media queries already hide what
     doesn't fit at narrow widths. */
  html,body{background:transparent}
  .bar{border-bottom:1px solid var(--line);flex-wrap:wrap;row-gap:4px}
</style>
</head>
<body class="compact">
<div id="app">
  <section class="cal">
    <header class="bar">
      <div class="nav">
        <button id="prev">&lsaquo;</button>
        <button id="today" class="today">Today</button>
        <button id="next">&rsaquo;</button>
      </div>
      <div class="title" id="title"></div>
      <div class="spacer"></div>
      <div class="searchwrap full-only">
        <input id="search" type="search" placeholder="Search…">
        <div id="searchresults" hidden></div>
      </div>
      <select class="views" id="viewsel" title="View">
        <option value="day">Day</option>
        <option value="3day">3 days</option>
        <option value="week" selected>Week</option>
        <option value="7day">7 days</option>
        <option value="month">Month</option>
        <option value="agenda">Schedule</option>
      </select>
      <button class="icon" id="toggledone" title="Hide/show completed tasks">☑</button>
      <button class="icon full-only" id="settingsbtn" title="Settings">&#9881;</button>
      <button class="add" id="addbtn">+ Add</button>
      <button class="icon" id="taskstoggle" title="Tasks">&#9776;</button>
      <a class="icon" href="./" target="_blank" rel="noopener" title="Open full page">&#8599;</a>
    </header>
    <div id="gridwrap" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
  </section>
  <aside class="tasks" id="tasks">
    <div class="tasks-resize" id="tasksresize" title="Drag: width · double-click: reset"></div>
    <div class="head">
      <b id="tasksheading">Tasks</b>
      <select class="tabs" id="tasktabsel" title="Task tab">
        <option value="open">Open</option>
        <option value="done">Completed</option>
        <option value="trash">Deleted</option>
      </select>
    </div>
    <div class="body" id="tasksbody"></div>
  </aside>
</div>
<dialog id="dlg"></dialog>
<script src="static/app.js?v=23"></script>
</body>
</html>
